function sendDiscordEmbed(title, description, color, imageURL) {
    if (!CONFIG.discordWebhook || CONFIG.discordWebhook === "COLOQUE_SUA_URL_WEBHOOK_AQUI") {
        log("⚠️ Webhook não configurado. Mensagem não enviada.");
        return;
    }

    const embed = {
        title: title,
        description: description,
        color: parseInt(color.replace("#", "0x")),
        timestamp: new Date().toISOString(),
        footer: {
            text: "Forlent Sky 🏴‍☠️ | AFK Farming System"
        },
        author: {
            name: CONFIG.botName
        }
    };

    if (imageURL) {
        embed.thumbnail = {
            url: imageURL
        };
    }

    const payload = {
        embeds: [embed]
    };

    try {
        // Usa a biblioteca HTTP nativa do Auto.js para enviar o Webhook
        const http = http.post(CONFIG.discordWebhook, {
            body: payload,
            headers: {
                "Content-Type": "application/json"
            }
        });
        
        if (http.statusCode === 204 || http.statusCode === 200) {
            log("📡 Webhook enviado com sucesso.");
        } else {
            log("⚠️ Erro ao enviar Webhook. Status: " + http.statusCode);
        }
    } catch (e) {
        log("❌ Falha crítica no envio do Webhook: " + e);
    }
}

function log(msg) {
    console.log(msg);
    // Atualiza o log no GUI Principal se estiver aberto
    // Nota: Como o GUI principal é finalizado ao iniciar o farm,
    // este log serve para o console do Auto.js e para notificações futuras.
    // Se você quiser um log flutuante, adicione um TextView no Overlay.
    console.log("[Forlent Sky] " + msg);
}

// ==================== INICIALIZAÇÃO ====================
// Garante que o script inicie corretamente ao abrir o app
// auto.waitFor() aguarda a permissão de Acessibilidade
auto.waitFor();
toast.log("✅ Forlent Sky v5.1 Carregado com Sucesso!");

// Verifica se a permissão de Acessibilidade está ativa
if (!auto.bound()) {
    toast.error("❌ Permissão de Acessibilidade não ativada!");
    toast.log("Ative a Acessibilidade do Auto.js nas configurações do Android.");
}
